---
- name: Read the short config
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  vars:
    policyflow_config: "{{ playbook_dir }}/../config/policyflow.yml"
  tasks:
    - name: Validate frameworks, report detail, email, and rules
      ansible.builtin.import_role:
        name: config

- name: Read each Linux lab machine
  hosts: linux
  gather_facts: true
  become: false
  vars:
    policyflow_config: "{{ playbook_dir }}/../config/policyflow.yml"
  tasks:
    - name: Validate frameworks, report detail, email, and rules
      ansible.builtin.import_role:
        name: config

    - name: Test each configured rule on this machine
      policyflow_check:
        kind: rule
        name: "{{ item.name }}"
        action: "{{ item.action }}"
        port: "{{ item.port }}"
        source: "{{ item.source }}"
      loop: "{{ rules }}"
      register: rule_checks

    - name: Keep the rule results for the report
      ansible.builtin.set_fact:
        policyflow_findings: "{{ policyflow_findings | default([]) + [item.finding] }}"
      loop: "{{ rule_checks.results }}"
      when: item.finding is defined

    - name: Test the host controls
      policyflow_check:
        kind: control
        name: "{{ item.name }}"
        desired: "{{ item.desired }}"
      loop:
        - name: ssh_root_login
          desired: "no"
        - name: ssh_password_auth
          desired: "no"
        - name: firewall_default
          desired: drop
        - name: logging_service
          desired: running
      register: control_checks

    - name: Keep the control results for the report
      ansible.builtin.set_fact:
        policyflow_findings: "{{ policyflow_findings | default([]) + [item.finding] }}"
      loop: "{{ control_checks.results }}"
      when: item.finding is defined

- name: Write the report
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  tasks:
    - name: Collect findings from each machine
      ansible.builtin.set_fact:
        report_hosts: >-
          {{
            report_hosts | default([]) + [{
              'host': item,
              'findings': hostvars[item].policyflow_findings | default([])
            }]
          }}
      loop: "{{ groups['linux'] }}"

    - name: Write the text report
      ansible.builtin.copy:
        dest: "{{ playbook_dir }}/../reports/policyflow.txt"
        mode: "0644"
        content: |
          {% for machine in report_hosts %}
          host {{ machine.host }}
          {% for finding in machine.findings %}
          {{ finding.name }}  {{ finding.result }}  desired={{ finding.desired }}  observed={{ finding.observed }}
          {% endfor %}
          {% endfor %}

